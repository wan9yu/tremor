name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Reproduces the daily pre-collect gate EXACTLY: same Python, and only the
  # pinned runtime dependencies. A gate test that needs a dev-only package
  # fails here, on a push, instead of at daily.yml where it would cost an
  # irreplaceable collection day.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -c "import PIL, matplotlib; print('pillow', PIL.__version__)"
      - run: python -m unittest discover tests
      - run: node tests/render_smoke.js

  # Source-vs-source checks. These may use dev dependencies because they never
  # run in the collection path.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m unittest discover tests -p "lint_*.py"
