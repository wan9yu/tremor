name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Reproduces the daily pre-collect gate's ENVIRONMENT exactly: same Python,
  # and only the pinned runtime dependencies. The step set is a deliberate
  # superset of that gate — it also runs render_smoke.js, which daily.yml
  # itself only runs POST-commit — so a gate test that needs a dev-only
  # package, or a rendering break, fails here on a push instead of costing
  # an irreplaceable collection day.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -c "import PIL, matplotlib; print('pillow', PIL.__version__)"
      - run: python -m unittest discover tests
      - run: node tests/render_smoke.js

  # Source-vs-source checks: coding-convention scans moved out of the
  # pre-collect gate, because a convention violation must never abort a
  # collection day (see daily.yml's gate step). No lint_*.py file imports
  # anything outside the stdlib — they all route their reads through
  # tests/support.py, whose stdlib-only property is itself checked by
  # lint_support_stdlib.py — so nothing is installed here at all, not even
  # the pinned runtime deps. That keeps this job independent of whether any
  # dependency happens to install on this runner's Python.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # On Python 3.12, `unittest discover` with zero matches exits 5 ("NO
      # TESTS RAN") instead of the 0 it exits on 3.11 — confirmed by running
      # both interpreters locally. Treat exit 5 as a pass so an empty pattern
      # never fails the job; any other exit code still fails it.
      - run: python -m unittest discover tests -p "lint_*.py" || [ $? -eq 5 ]
