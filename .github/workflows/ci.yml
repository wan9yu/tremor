name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Reproduces the daily pre-collect gate EXACTLY: same Python, and only the
  # pinned runtime dependencies. A gate test that needs a dev-only package
  # fails here, on a push, instead of at daily.yml where it would cost an
  # irreplaceable collection day.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -c "import PIL, matplotlib; print('pillow', PIL.__version__)"
      - run: python -m unittest discover tests
      - run: node tests/render_smoke.js

  # Source-vs-source checks. No lint_*.py file imports numpy or scipy — the
  # only file in the repo that does is tools/calibrate_threshold.py, which
  # this job never runs — so requirements-dev.txt is deliberately NOT
  # installed here. That keeps this job independent of whether the dev pin
  # happens to install on this runner's Python.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # No lint_*.py file exists yet (they arrive in a later plan), and on
      # Python 3.12 `unittest discover` with zero matches exits 5 ("NO TESTS
      # RAN") instead of the 0 it exits on 3.11 — confirmed by running both
      # interpreters locally. Treat exit 5 as a pass so an empty pattern
      # never fails the job; any other exit code still fails it.
      - run: python -m unittest discover tests -p "lint_*.py" || [ $? -eq 5 ]
