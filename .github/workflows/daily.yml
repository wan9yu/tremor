name: tremor daily

on:
  schedule:
    # Fire EARLY (18:00Z) and sleep to the 22:30Z sample target below. GitHub-Actions
    # queue latency is one-sided (jobs start late, never early), so a head-start plus a
    # sleep makes the collection land at a FIXED hour — flights is a concurrent snapshot
    # and a mistimed sample reads the diurnal cycle as a flight change (R25). Collection
    # still happens ~22:30Z = 06:30 China (after the onshore FX close); the row date is
    # unchanged.
    - cron: "0 18 * * *"
  workflow_dispatch: {}    # allow manual runs (fire 18:00-22:30Z so the sample lands on target)

permissions:
  contents: write          # commit the day's data back to the repo
  issues: write            # raise an alarm when a run fails (see the last step)

concurrency:
  group: tremor-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The scoring rules are the instrument. If they have drifted, stop before
      # writing a row rather than committing readings judged by broken rules.
      # ONLY pure logic may run in this gate. Nothing here may assert a property
      # of already-committed data — an upstream surprise in yesterday's files
      # would then abort every subsequent run before it collected anything.
      # Those checks live in audit_*.py and run AFTER the commit below. Nor may
      # a pure coding-convention scan (no property of the running instrument,
      # just a source-vs-source check) run here — those are lint_*.py files,
      # excluded by discover's default `test*.py` pattern, and run on push
      # instead (see ci.yml's lint job): a convention violation must never
      # abort a collection day. (Runs BEFORE the sleep below, so broken rules
      # fail fast without a 4.5h wait.)
      - name: Check the scoring rules
        run: python -m unittest discover tests

      # Land the collection at the FIXED 22:30Z sample hour. The schedule fires at
      # 18:00Z to absorb GitHub-Actions queue latency, which is one-sided (jobs start
      # late, never early). Sleep until today's 22:30:00Z — but only when it is 0-4.5h
      # ahead (the intended pre-target window), so a run whose queue delay wrapped it
      # past midnight never sleeps ~20h. A run delayed PAST the window collects
      # immediately and collect.py's sample-hour guard (any line declaring
      # SAMPLE_TARGET_UTC_H — today flights and cnh_cny) darks the off-hour read.
      # 22:30Z is the historical effective sample hour, so the baseline is continuous.
      - name: Sleep until the 22:30Z sample target
        run: |
          export TZ=UTC
          target=$(date -d 'today 22:30:00' +%s)
          now=$(date +%s)
          wait=$(( target - now ))
          if [ "$wait" -gt 0 ] && [ "$wait" -le 16200 ]; then
            echo "sleeping ${wait}s until 22:30:00Z"; sleep "$wait"
          else
            echo "not in the pre-target window (wait=${wait}s) — collecting now; the guard handles the hour"
          fi

      - name: Collect today's readings
        env:
          # FRED_API_KEY (credit spread) and FINGRID_API_KEY (grid frequency, with
          # a keyless Statnett fallback) are read from repo Secrets. Flights (keyless
          # community ADS-B) and the Korea premium need no key.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINGRID_API_KEY: ${{ secrets.FINGRID_API_KEY }}
        run: python collect.py

      # The day is committed the moment it is collected. Nothing presentational
      # may stand between collection and the push that makes the day durable:
      # several lines are live snapshots with no archive, so any step that can
      # fail here costs a day that cannot be re-fetched. tools/ci_push.sh is
      # the one home for the rebase-and-retry policy: the intraday sampler
      # shares this branch and scheduler delays have been observed to exceed
      # the cron offset between the two. The commit is dated in China time to
      # match the rows it carries.
      - name: Commit the day
        run: |
          git config user.name "tremor-bot"
          git config user.email "actions@users.noreply.github.com"
          tools/ci_push.sh "data: $(TZ=Asia/Shanghai date +%F)" data/ docs/data/

      # Everything second-order comes after the data is safely pushed: the
      # level layer is DERIVED (recomputed in full from the component record)
      # and the charts are presentation — a bug in either is worth an alarm,
      # never worth a lost day.
      - name: Derive levels and drifts, render charts, commit
        run: |
          python tools/level_layer.py
          python tools/drift_layer.py
          python tools/stuck_panel.py
          python tools/episodes.py --json > data/episodes.json
          python render.py
          tools/ci_push.sh "derived: $(TZ=Asia/Shanghai date +%F)" \
            charts/ data/levels.csv data/drifts.csv data/episodes.json docs/data/stuck.csv

      # VERIFY AFTER COMMITTING, NEVER BEFORE. Several lines are live snapshots
      # with no archive to re-fetch from, so a gate that fails before the commit
      # destroys that day permanently — and a silently missing row is the one
      # thing this project forbids everywhere else: an absence with no stated
      # reason. So the day is recorded first and audited second. A failure here
      # raises the alarm issue below; the row stays, and a wrong verdict is
      # corrected under the normal archive-and-restart rule.
      #
      # What this checks: a row written today that cannot be reproduced by the
      # current scorer means the collector and the scorer have drifted apart.
      # Divergence on OLD rows is expected and ignored — that is the forward-only
      # rule showing its seams. A deliberate scoring change bumps STABLE_SINCE in
      # tools/replay.py, which forces the change to be declared, not slipped in.
      - name: Audit that today's row replays
        run: python tools/replay.py --check

      # The record audits: replay of every committed row since STABLE_SINCE and
      # the component-panel checks. These assert properties of committed DATA,
      # which an upstream source can break at any time — which is exactly why
      # they run here, behind the commit, and never in the pre-collect gate.
      - name: Audit the committed record
        run: python -m unittest discover tests -p "audit_*.py"

      # Presentation, so it audits AFTER the commit for the same reason: a broken
      # dashboard is worth an alarm, never worth a lost day of data.
      - name: Audit that the dashboard renders
        run: node tests/render_smoke.js

      # A silent instrument is the failure mode that ends this project. The daily
      # commit is also what keeps the schedule alive — GitHub disables a cron
      # workflow after 60 days without repository activity — so a run that keeps
      # failing does not merely lose days, it eventually switches tremor off with
      # nobody told. Raise one open issue and keep appending to it.
      - name: Raise the alarm on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="tremor: the daily collection is failing"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number \
                --jq '.[0].number // empty')
          BODY="Run failed on $(date -u +%F) — $RUN_URL

          The instrument writes no row for a failed run, and the schedule itself
          expires after 60 days without a commit. Fix or disable deliberately."
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
