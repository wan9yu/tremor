<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tremor — readings, kept in view</title>
<!-- Chart.js is vendored, not loaded from a CDN: jsdelivr is blocked in China, so
     the operator could not reliably see their own dashboard. The CDN stays as a
     fallback only if the local copy is ever missing. -->
<script src="vendor/chart.umd.min.js"></script>
<script>
  if (typeof Chart === "undefined") {
    document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"><\/script>');
  }
</script>
<style>
  :root{
    --bg:#0e0f12; --panel:#16181d; --line:#23262e; --ink:#e7e9ee; --muted:#8a909c;
    --calm:#3fb27f; --amber:#e0a83d; --orange:#e07b39; --alarm:#d64545;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 64px}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  header h1{font-size:30px;margin:0;letter-spacing:.5px}
  header p.tag{color:var(--muted);margin:.3em 0 0;font-size:15px}
  .langtoggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
  .langtoggle button{background:transparent;color:var(--muted);border:0;padding:5px 11px;
    font-size:12px;cursor:pointer;font-family:inherit}
  .langtoggle button.on{background:var(--line);color:var(--ink)}
  .count{display:flex;align-items:baseline;gap:14px;margin:0 0 8px;cursor:pointer;
    padding:18px 22px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .count:hover{border-color:#33373f}
  .count .n{font-size:54px;font-weight:700;line-height:1}
  .count .of{color:var(--muted);font-size:20px}
  .count .label{color:var(--muted);font-size:14px}
  .count .darknote{color:#ff6b6b;font-size:13px}
  .count .calibnote{color:var(--muted);font-size:13px}
  .count .pairnote{color:#e0a83d;font-size:13px}
  .count .q{margin-left:auto;color:var(--muted);font-size:13px;align-self:center}
  .count-qualifying{color:var(--muted);font-size:12px;margin:0 2px 8px}
  .count-level{margin:0 0 8px}
  .count-level .n{font-size:44px}
  .kicker{color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase;margin:22px 2px 5px}
  .level-kicker{margin-top:18px}
  .asof{color:var(--muted);font-size:13px;margin:0 0 16px}
  .sysstatus{border-radius:10px;padding:11px 15px;margin:0 0 18px;font-size:13px;
    border:1px solid var(--line);background:var(--panel)}
  .sysstatus .h{font-weight:600}
  .sysstatus.ok{border-color:rgba(63,178,127,.4)}
  .sysstatus.ok .h{color:var(--calm)}
  .sysstatus.warn{border-color:rgba(224,123,57,.5);background:rgba(224,123,57,.08)}
  .sysstatus.warn .h{color:var(--orange)}
  .sysstatus.alarm{border-color:var(--alarm);background:rgba(214,69,69,.12)}
  .sysstatus.alarm .h{color:#ff6b6b}
  .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin:0 0 18px}
  @media(max-width:680px){.strip{grid-template-columns:1fr 1fr}}
  .inst{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    border-left:3px solid var(--dot,#7f8696);cursor:pointer;transition:border-color .12s}
  .inst:hover{border-top-color:#33373f;border-right-color:#33373f;border-bottom-color:#33373f}
  .inst.dark{border-left-color:var(--alarm);background:rgba(214,69,69,.07)}
  .inst .domain{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}
  .inst .now{font-size:20px;font-weight:600;margin:6px 0 1px}
  .inst .now .u{font-size:12px;color:var(--muted);font-weight:400}
  .inst .nodata{color:#ff6b6b;font-size:15px;font-weight:600}
  .inst .sub{color:var(--muted);font-size:11px}
  .inst .more{color:#6f7686;font-size:10px;margin-top:6px}
  .pill{display:inline-block;font-size:10px;padding:1px 7px;border-radius:999px;
    border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:middle}
  .pill.trembling{color:#fff;background:var(--alarm);border-color:var(--alarm)}
  /* disclosure, not suppression: still reads "trembling", just visibly muted/hatched
     to say an instrument artifact or a common-mode machine lean sits under it */
  .pill.trembling.adjudicated{color:#ff6b6b;border-color:rgba(214,69,69,.55);
    background:repeating-linear-gradient(45deg,rgba(214,69,69,.16) 0 4px,rgba(214,69,69,.32) 4px 8px)}
  .pill.benign{color:#0e0f12;background:var(--calm);border-color:var(--calm)}
  .pill.calib{color:var(--muted);border-color:var(--line);background:transparent}
  .modal-card .annoh{font-size:13px;margin:16px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .modal-card .anno{font-size:13px;line-height:1.5;margin:0 0 8px;color:#c7ccd6}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 16px 10px}
  .panel h2{font-size:14px;margin:0;font-weight:600}
  .panel .hint{color:var(--muted);font-size:12px;margin:2px 0 10px}
  .panelhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .rangetoggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
  .rangetoggle button{background:transparent;color:var(--muted);border:0;padding:3px 9px;
    font-size:11px;cursor:pointer;font-family:inherit}
  .rangetoggle button.on{background:var(--line);color:var(--ink)}
  .watchlist{color:var(--muted);font-size:12px;margin:14px 2px 0;line-height:1.7}
  .watchlist b{color:#9aa1ad;font-weight:600}
  .watchlist .dot{display:inline-block;width:7px;height:7px;border-radius:999px;background:#5b616d;margin-right:5px;vertical-align:middle}
  .watchlist .days{opacity:.7}
  .wl-item{cursor:pointer;white-space:nowrap;display:inline-block;margin:0 14px 4px 0}
  .coverage{color:var(--muted);font-size:12px;margin:-6px 2px 18px;line-height:1.6}
  .coverage .cmore{color:#9aa1ad;cursor:pointer;margin-left:4px}
  .coverage .cmore:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  .limits{margin-top:16px}
  .limits ul.cov{margin:8px 0 12px;padding-left:18px;font-size:13px;line-height:1.62;color:var(--muted)}
  .limits ul.cov li{margin:0 0 5px}
  .limits p{color:var(--muted);font-size:13px;line-height:1.62;margin:0 0 10px;max-width:82ch}
  .modal-card ul.cov{margin:0 0 12px;padding-left:18px;font-size:14.5px;line-height:1.62;color:#c7ccd6}
  .modal-card ul.cov li{margin:0 0 5px}
  .wl-item:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  .wl-blind{color:var(--amber);opacity:.85}
  .wl-gap{color:#ff6b6b}
  .modal-card .mchart{margin:12px 0 4px}
  .modal-card .mnow{font-size:15px;margin:10px 0 2px;color:#c7ccd6}
  footer{color:var(--muted);font-size:13px;margin-top:34px;border-top:1px solid var(--line);padding-top:18px}
  footer a{color:#9fb6ff}
  code{background:#1d2129;padding:1px 5px;border-radius:5px;font-size:12px}
  /* modal */
  .modal[hidden]{display:none}
  .modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.6)}
  .modal-card{position:relative;max-width:540px;width:100%;max-height:85vh;overflow:auto;
    background:#15171c;border:1px solid var(--line);border-radius:14px;padding:24px 24px 22px;
    box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal-card .mdomain{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.7px}
  .modal-card h3{font-size:20px;margin:4px 0 2px}
  .modal-card .tags{margin:6px 0 14px}
  .modal-card .tag2{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);
    border-radius:999px;padding:2px 9px;margin-right:6px}
  .modal-card p{font-size:14.5px;line-height:1.62;margin:0 0 12px}
  .modal-x{position:absolute;top:12px;right:14px;background:transparent;border:0;color:var(--muted);
    font-size:24px;line-height:1;cursor:pointer}
  .modal-x:hover{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <h1>tremor</h1>
      <div class="langtoggle" id="langtoggle">
        <button data-lang="en">EN</button><button data-lang="zh">中文</button>
      </div>
    </div>
    <p class="tag" id="tag"></p>
  </header>

  <div class="kicker" id="count-kicker"></div>
  <div class="count" id="count">
    <span class="label" id="count-prefix" hidden></span>
    <span class="n" id="count-n">–</span>
    <span class="of" id="count-of-wrap"><span id="count-sep">/ </span><span id="count-of">4</span></span>
    <span class="label" id="count-label"></span>
    <span class="q" id="count-q"></span>
  </div>
  <p class="count-qualifying" id="count-qualifying"></p>
  <p class="asof" id="asof"></p>
  <div class="kicker level-kicker" id="level-kicker" hidden></div>
  <div class="count count-level" id="level-count" hidden>
    <span class="n" id="level-n">–</span>
    <span class="label" id="level-label"></span>
    <span class="q" id="level-q"></span>
  </div>

  <div class="sysstatus" id="sysstatus" hidden></div>

  <div class="strip" id="strip"></div>

  <p class="coverage" id="coverage" hidden></p>

  <div class="panel">
    <div class="panelhead">
      <h2 id="panel-title"></h2>
      <div class="rangetoggle" id="rangetoggle">
        <button data-range="30"></button><button data-range="90"></button><button data-range="365"></button><button data-range="all"></button>
      </div>
    </div>
    <p class="hint" id="panel-hint"></p>
    <canvas id="chart" height="150"></canvas>
  </div>

  <div class="panel" style="margin-top:16px">
    <h2 id="feel-title"></h2>
    <p class="hint" id="feel-hint"></p>
    <canvas id="feelchart" height="120"></canvas>
  </div>

  <p class="watchlist" id="watchlist" hidden></p>

  <section class="panel limits" id="limits" hidden></section>

  <footer id="footer"></footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="modal-card" id="modal-card">
    <button class="modal-x" id="modal-x" aria-label="close">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ---------- language + cookie (default English) ----------
function getLang(){ const m=document.cookie.match(/(?:^|;)\s*tremor_lang=(en|zh)/); return m?m[1]:"en"; }
function setLang(l){ document.cookie="tremor_lang="+l+";path=/;max-age="+(3600*24*365); }
// chart range (days of history shown); persists like the language choice
function getRange(){ const m=document.cookie.match(/(?:^|;)\s*tremor_range=(30|90|365|all)/); return m?m[1]:"90"; }
function setRange(r){ document.cookie="tremor_range="+r+";path=/;max-age="+(3600*24*365); }

// ---------- per-line metadata (bilingual) ----------
// `watches` states each tier-1 line's actual field of view. The coverage line
// and the scope-and-limits section are both DERIVED from it, so they cannot go
// stale on a tier swap. Only `limitsBody` / `limitsFlights` — the prose about
// what this record cannot see — are written by hand and must be revisited when
// coverage genuinely changes.
const LINES = [
  { id:"flights", color:"#5aa9e6", alarm:"down",
    watches:{en:"W/C Europe · US East · US West · Japan/E Asia",zh:"西/中欧 · 美东 · 美西 · 日本/东亚"},
    unit:{en:"aircraft",zh:"架"},
    domain:{en:"Airspace",zh:"空域"},
    label:{en:"Aircraft airborne",zh:"在飞航班量"},
    source:{en:"Community ADS-B, 4 busy regions",zh:"社区 ADS-B，4 个繁忙空域"},

      en:"Aircraft reported airborne across W/C Europe, US East, US West, and Japan/E Asia, summed from one ADS-B snapshot at 22:30 UTC each day; unit: aircraft.",
      zh:"每日 22:30 UTC 对西/中欧、美东、美西及日本/东亚各取一次 ADS-B 快照，合计当时报告在空的飞机数；单位：架。"} },
  { id:"credit_spread", color:"#e0a83d", alarm:"up",
    watches:{en:"the US high-yield bond market",zh:"美国高收益债市场"},
    unit:{en:"pp",zh:"个百分点"},
    domain:{en:"Financial system",zh:"金融系统"},
    label:{en:"US HY credit spread (OAS)",zh:"美国高收益债信用利差 (OAS)"},
    source:{en:"FRED — ICE BofA US High-Yield OAS",zh:"FRED — ICE BofA 美国高收益债 OAS"},
    measures:{
      en:"Daily ICE BofA US High Yield option-adjusted spread for US high-yield bonds, on the latest available business date; unit: percentage points (pp).",
      zh:"美国高收益债的 ICE BofA US High Yield 期权调整利差，按最新可得的交易日记录；单位：百分点（pp）。"} },
  { id:"capital_premium", color:"#c678dd", alarm:"up", tier:2,
    unit:{en:"%",zh:"%"},
    domain:{en:"Capital controls",zh:"资本管制"},

  { id:"grid_frequency", color:"#3fb27f", alarm:"up", tier:2,

  { id:"cnh_cny", color:"#e0617d", alarm:"up", tier:1,

  { id:"gdelt", color:"#6f7686", alarm:"up", tier:2,

  { id:"sofr_iorb_spread", color:"#c9a227", alarm:"up", tier:2,

    measures:{
      en:"ICE BofA Emerging Markets Corporate option-adjusted spread for emerging-market corporate bonds, latest available business date; unit: percentage points (pp).",

  { id:"port_throughput", color:"#cd853f", alarm:"down", tier:2,

// ---------- CSV ----------
function splitCSVLine(line){
  const out=[]; let cur="", q=false;
  for(let i=0;i<line.length;i++){ const c=line[i];
    if(q){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else { if(c==='"') q=true; else if(c===",") {out.push(cur);cur="";} else cur+=c; } }
  out.push(cur); return out;
}
function parseCSV(text){
  const rows=text.replace(/﻿/,"").trim().split(/\r?\n/);
  if(rows.length<2) return [];
  const head=splitCSVLine(rows[0]);
  return rows.slice(1).filter(r=>r.length).map(r=>{ const cells=splitCSVLine(r), o={};
    head.forEach((h,i)=>o[h]=cells[i]??""); return o; });
}
async function getCSV(path){ try{ const r=await fetch(path,{cache:"no-store"}); if(!r.ok) return []; return parseCSV(await r.text()); }catch(e){ return []; } }

// wrap a long annotation into tooltip-sized lines (Chart.js renders string arrays as multiline)
function wrapNote(s,width=48,maxLines=4){
  const words=s.split(" "), lines=[]; let cur="";
  for(const w of words){
    if((cur+" "+w).trim().length>width){ lines.push(cur.trim()); cur=w;
      if(lines.length===maxLines){ lines[maxLines-1]+=" …"; return lines; } }
    else cur+=" "+w;
  }
  if(cur.trim()) lines.push(cur.trim());
  return lines;
}
function fmt(v){ const n=parseFloat(v); return Math.abs(n)>=1000?n.toLocaleString():(""+v); }
// RECORD TEXT IS NOT MARKUP. Every string on this page that came from a CSV is
// run through esc() before it is interpolated into markup: a source_note is
// written by a fetcher from whatever a remote answered (the record already holds
// a gateway's whole HTML error page in one), and an annotation note is free
// text. Escaping at the sink is what makes that safe whatever wrote it.
function esc(v){ return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
// THE ONE PLACE THIS PAGE WRITES MARKUP. Every argument is markup built here from
// trusted constants (T, LINES) with any record-derived text already through esc().
// Routing every write through one function is what makes that reviewable: a lint
// test asserts this file contains exactly one innerHTML, inside setMarkup, so a
// future `el.innerHTML = someRow.source_note` cannot be added quietly.
// pi-lens-ignore: ast-grep:no-inner-html-js
function setMarkup(el,html){ el.innerHTML=String(html==null?"":html); }
function countColor(n){ return n>=3?"var(--alarm)":n===2?"var(--orange)":n===1?"var(--amber)":"var(--calm)"; }
function utcMidnight(d){ const p=d.split("-").map(Number); return Date.UTC(p[0],p[1]-1,p[2]); }
// Rows are dated in China time (UTC+8), so compute "today" the same way for the staleness gap.
function nowChinaMidnight(){ const t=new Date(Date.now()+8*3600*1000); return Date.UTC(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate()); }

// ---------- modal ----------
let modalChart=null;
function openModal(html){ if(modalChart){modalChart.destroy();modalChart=null;} setMarkup(document.getElementById("modal-body"),html); document.getElementById("modal").hidden=false; }
function closeModal(){ if(modalChart){modalChart.destroy();modalChart=null;} document.getElementById("modal").hidden=true; }
document.getElementById("modal-x").onclick=closeModal;
document.getElementById("modal-backdrop").onclick=closeModal;
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

function lineModal(L,lang){
  const dir = L.alarm==="down"?T[lang].dirDown:T[lang].dirUp;
  const annos=annosFor(L.id).slice(-3).reverse();
  const annoHtml=annos.length
    ? `<h4 class="annoh">${T[lang].annoTitle}</h4>`+annos.map(a=>
        `<p class="anno"><b>${esc(a.date)}</b> <span class="tag2">${esc(a.verdict)}</span> ${esc(a.note)}</p>`).join("")
    : "";
  return `<div class="mdomain">${L.domain[lang]}</div>
    <h3>${L.label[lang]}</h3>
    <div class="tags"><span class="tag2">${T[lang].alarmTag(dir)}</span><span class="tag2">${T[lang].source}: ${L.source[lang]}</span></div>
    <h4 class="annoh">${T[lang].measuresLabel}</h4><p>${L.measures[lang]}</p>${annoHtml}`;
}
function countModal(lang){
  const m=headlineDenominator==null?"":headlineDenominator;
  return `<h3>${T[lang].countModalTitle}</h3><p>${T[lang].countModalBody(m)}</p>`;
}
function levelModal(lang){ return `<h3>${T[lang].referenceTitle}</h3><p>${T[lang].referenceBody}</p>`; }

// ---------- data + render ----------
let DATA=null, chart=null, feelChart=null;
// The comparable-line denominator from the last render, so the count
// explanation modal states the SAME {m} the headline shows.
let headlineDenominator=null;
// Straits that have ever opened a level state. Proper nouns fall back to their
// English name in either language; only the two ever seen carry a translation.
const STRAIT_LABEL={"Strait of Hormuz":{en:"Strait of Hormuz",zh:"霍尔木兹海峡"},
                    "Kerch Strait":{en:"Kerch Strait",zh:"刻赤海峡"}};
const straitLabel=(c,lang)=>(STRAIT_LABEL[c]||{})[lang]||c;
// display-side hedge: MIN_POINTS=10 is the scoring floor, but a robust scale
// stays jumpy on short windows until roughly this many unique observations exist
const CALIBRATING_OBS=30;
// A day "diverges" when the felt side runs hot while every primary instrument
// reads calm. This is a DESCRIPTION, not a diagnosis: the cause may be excess
// feeling or missing coverage, and the instrument cannot distinguish them.
const FEEL_IDS=["vix","gdelt_tone","gdelt"];
// The full status vocabulary core/normalize.py can write to a row's `status`
// column (see that module's docstring). Bound to normalize.ALL_STATUSES by
// tests/lint_public_surface.py, so a status added or removed there is caught
// here instead of drifting silently.
const STATUS=["scoring","warming-up","stale","dark","closed","no-spread"];
// Mirrors normalize.BLIND_STATUSES: a line HOLDING a reading it cannot judge.
const BLIND=["warming-up","no-spread"];
// A tier-2 line whose latest reading is one of these — for GAP_RUN_LOUD or
// more CONSECUTIVE collections — has no reading at all, not merely a reading
// it cannot judge (BLIND, above) or a republished one (stale). Left off the
// watchlist item, this looked exactly like calm: the "dark":"NO DATA" label
// (statusLabel, above) already existed but nothing ever read it for a tier-2
// line. Only `dark` qualifies today — `closed` is a genuine market closure,
// not a failure, and already carries its own distinct label. Bound to
// normalize.ALL_STATUSES (as a subset) by tests/lint_public_surface.py.
const GAP_STATUSES=["dark"];
// One missed collection is noise (a timeout, a transient 502); two or more in
// a row is a real gap worth breaking the calm look for.
const GAP_RUN_LOUD=2;
const isBlind=r=>BLIND.includes(r.status);
// How many of `rows`' most recent entries, counting back from the last one,
// carry a GAP_STATUSES status without interruption — e.g. dark, dark, dark,
// scoring, dark returns 3, not 4: only the RUN ending at today counts, a
// single dark day nine readings ago is not today's gap.
function gapRunLength(rows){
  let n=0;
  for(let i=rows.length-1;i>=0;i--){
    if(!GAP_STATUSES.includes(rows[i].status)) break;
    n++;
  }
  return n;
}
// How many of `rows`' most recent entries, counting back from the last one,
// are alarm-direction trembles without interruption -- the run-ending-at-today
// walk, same shape as gapRunLength above but over trembling+direction instead
// of a GAP_STATUSES status. Pure client compute, no new data: it never touches
// the trembling integer itself, only whether a firing line reads as a fresh
// alarm or day N of one already disclosed.
function tremblingRunLength(rows,alarmDir){
  let n=0;
  for(let i=rows.length-1;i>=0;i--){
    if(rows[i].trembling!=="1"||rows[i].direction!==alarmDir) break;
    n++;
  }
  return n;
}
const FEEL_HOT=2;
const isDivergent=(count,feelMax)=>count===0&&feelMax!==null&&feelMax>=FEEL_HOT;
async function load(){
  const [summary, annotations, stuck, leans, ...lineArr]=await Promise.all([
    getCSV("data/summary.csv"), getCSV("data/annotations.csv"), getCSV("data/stuck.csv"),
    getCSV("data/leans.csv"),
    ...LINES.map(L=>getCSV("data/"+L.id+".csv"))]);
  const lines={}; LINES.forEach((L,i)=>lines[L.id]=lineArr[i]);
  const annoMap=new Map(annotations.map(a=>[a.line+"|"+a.date,a]));
  // Same-day machine lean per firing tier-1 line, served by tools/lean_panel.py
  // (date,line,lean,evidence). Consulted by the headline only when nothing has
  // been annotated yet -- a human verdict in annotations.csv always wins.
  const leanMap=new Map(leans.map(r=>[r.line+"|"+r.date,r]));
  DATA={summary, dates:summary.map(r=>r.date), lines, annotations, annoMap, stuck, leanMap};
}
// annotation lookup: notes live in data/annotations.csv (date,line,verdict,note)
function annoOn(lineId,date){ return DATA.annoMap&&DATA.annoMap.get(lineId+"|"+date); }
// machine-lean lookup: same-day classifier verdicts live in data/leans.csv
// (date,line,lean,evidence). Guarded the same way annoOn is, so a DATA shape
// with no leanMap (an older fixture, say) reads as "no lean" rather than throwing.
function leanOn(lineId,date){ return DATA.leanMap&&DATA.leanMap.get(lineId+"|"+date); }
// Which annotations.csv verdicts actually adjudicate a tremble -- i.e. someone
// looked at THIS reading and judged it. method/correction/retraction rows are
// keyed to a (line,date) routinely (66/18/3 of them on file) but say nothing
// about whether the day's tremble is real; a firing line under one of those
// must still be treated as unannotated, so its same-day machine lean gets
// disclosed rather than silently reverting to a bare, unlabelled integer.
const ADJUDICATING_VERDICTS=new Set(["artifact","real","attributed","mixed","benign"]);
// The adjudicating annotation for (lineId,date), or undefined if none exists.
// Scans ALL of DATA.annotations for that key -- never the last-wins annoMap,
// which a same-day method/correction/retraction row can shadow (2026-09-04
// net_outages carries both a retraction and an artifact row for the same
// day) -- and returns the LAST adjudicating row among any duplicates,
// mirroring annoMap's own last-write-wins rule but restricted to rows that
// are actually adjudications. Shared by the headline qualifier and the strip
// pill hatch so the two can never disagree.
function adjudication(lineId,date){
  const rows=(DATA.annotations||[]).filter(a=>a.line===lineId&&a.date===date&&ADJUDICATING_VERDICTS.has(a.verdict));
  return rows.length?rows[rows.length-1]:undefined;
}
function annosFor(lineId){ return (DATA.annotations||[]).filter(a=>a.line===lineId&&a.verdict!=="method"); }
// count unique observations (dedup by obs_date; rows without obs_date all count)
function uniqueObs(rows){
  const seen=new Set(); let n=0;
  for(const r of rows){ if(r.raw_value==="")continue;
    const o=r.obs_date||""; if(o){ if(seen.has(o))continue; seen.add(o); } n++; }
  return n;
}

function render(){
  const lang=getLang();
  document.documentElement.lang = lang==="zh"?"zh":"en";
  document.querySelectorAll("#langtoggle button").forEach(b=>b.classList.toggle("on", b.dataset.lang===lang));
  document.title=T[lang].title;
  document.getElementById("tag").textContent=T[lang].promise;
  document.getElementById("panel-title").textContent=T[lang].panelTitle;
  document.getElementById("panel-hint").textContent=T[lang].panelHint;
  setMarkup(document.getElementById("footer"),T[lang].footer);
  document.getElementById("count-q").textContent=T[lang].countQuestion;
  document.getElementById("count-kicker").textContent=T[lang].countTitle;
  document.getElementById("count-qualifying").textContent=T[lang].countQualifying;
  // The headline is one canonical template per language, split around its two
  // numbers so the numerator keeps its own display element and the denominator
  // keeps its own. The rendered sentence is exactly the template.
  const labelTpl=T[lang].countLabel;
  const nAt=labelTpl.indexOf("{n}"), mAt=labelTpl.indexOf("{m}");
  const countPrefix=document.getElementById("count-prefix");
  countPrefix.textContent=labelTpl.slice(0,nAt); countPrefix.hidden=!countPrefix.textContent;
  document.getElementById("count-sep").textContent=labelTpl.slice(nAt+3,mAt);
  const countTail=labelTpl.slice(mAt+3);

  const {summary,dates,lines}=DATA;
  const TIER1=LINES.filter(L=>(L.tier||1)===1);
  const TIER2=LINES.filter(L=>(L.tier||1)===2);
  const last=summary[summary.length-1];
  const gapDays=last?Math.floor((nowChinaMidnight()-utcMidnight(last.date))/86400000):null;
  const darkCount=last?(parseInt(last.dark_count||"0",10)||0):0;
  // The denominator is how many instruments could ACTUALLY ANSWER today. A line
  // holding a reading it cannot judge is blind, not calm — conflating the two is
  // how a strait closing went unreported for fifteen days. The collector owns
  // this count; rows written before the column existed leave it blank.
  const blindCount=last?(parseInt(last.blind_count||"0",10)||0):0;
  // A CLOSED market (the onshore yuan on a weekend) is not a failure and not blind —
  // there is simply no observation to have. It leaves the denominator like a line
  // that cannot answer today, but is NAMED as a closure, not an outage.
  const closedNames=last?TIER1.filter(L=>{
    const rows=lines[L.id]||[]; const r=rows[rows.length-1];
    return r&&r.date===last.date&&r.status==="closed";
  }).map(L=>L.label[lang]):[];
  const closedCount=closedNames.length;
  const comparableCount=Math.max(TIER1.length-blindCount-darkCount-closedCount,0);
  headlineDenominator=comparableCount;
  document.getElementById("count-of").textContent=comparableCount;

  // honesty: "0 — calm" while baselines are still building would overstate
  // confidence, so the headline carries a calibrating qualifier until then
  const calibN=TIER1.filter(L=>uniqueObs(lines[L.id]||[])<CALIBRATING_OBS).length;
  if(last){
    const n=parseInt(last.trembling_count||"0",10)||0;
    const el=document.getElementById("count-n"); el.textContent=n; el.style.color=countColor(n);
    // WHICH lines, not just how many. A count of two is not one fact: measured
    // per-line alarm rates differ by more than an order of magnitude, so a
    // credit + airspace pair is near-certainly two independent events while a
    // pair sharing a domain may be one event counted twice. Naming them lets a
    // reader judge that instead of trusting the integer.
    const firingLines=TIER1.filter(L=>{
      const rows=lines[L.id]||[]; const r=rows[rows.length-1];
      return r&&r.date===last.date&&r.trembling==="1"&&r.direction===L.alarm;
    });
    const firing=firingLines.map(L=>L.label[lang]);
    // Disclosure, not suppression: the integer above never changes. For each
    // firing line, say what the RECORD already knows about it. A human
    // ADJUDICATION (annotations.csv, via adjudication() above) always wins
    // over a same-day machine lean (leans.csv) -- the lean is consulted only
    // when nothing has actually adjudicated the tremble yet, even when the
    // adjudication itself carries no qualifier (verdict=benign) -- plus how
    // many days running it has been trembling, computed client-side from
    // that line's own history. Tagged with the line's own label only when
    // more than one line fires at once; a single firing line is otherwise
    // unambiguous.
    const adjBits=[];
    for(const L of firingLines){
      const rows=lines[L.id]||[];
      const anno=adjudication(L.id,last.date);
      const tag=firingLines.length>1?(L.label[lang]+": "):"";
      const vlabel=anno&&T[lang].verdictLabel[anno.verdict];
      if(vlabel){
        adjBits.push(" · "+tag+vlabel);
      } else if(!anno){
        const lean=leanOn(L.id,last.date);
        if(lean&&lean.lean==="common-mode") adjBits.push(T[lang].leanNote(tag,lean.evidence));
      }
      const run=tremblingRunLength(rows,L.alarm);
      if(run>=2) adjBits.push(T[lang].runNote(tag,run));
    }
    setMarkup(document.getElementById("count-label"),
      countTail + (firing.length>1?`<span class="pairnote">${T[lang].whichLines(firing)}</span>`:"")
           + adjBits.map(b=>`<span class="calibnote">${b}</span>`).join("")
           + (darkCount?`<span class="darknote">${T[lang].darkNote(darkCount)}</span>`:"")
           + (blindCount?`<span class="darknote">${T[lang].blindNote(blindCount)}</span>`:"")
           + (closedCount?`<span class="calibnote">${T[lang].closedNote(closedNames.join(", "))}</span>`:"")
           + (calibN?`<span class="calibnote">${T[lang].calibNote(calibN,TIER1.length)}</span>`:""));
    document.getElementById("asof").textContent=T[lang].asOf(last.date);
  }
  document.getElementById("count").onclick=()=>openModal(countModal(lang));

  // ---- second number: long-running readings below their fixed references ----
  // A different measure from the daily count above: the level layer holds a
  // named strait's state open against a pinned pre-event reference, and this
  // block reports how many such states are open now. Fed by the already-served
  // stuck.csv, which the R12 firewall keeps OUT of summary.csv and the scoring
  // path, so this number never feeds the daily count.
  const lc=document.getElementById("level-count");
  const lk=document.getElementById("level-kicker");
  const stuckRows=DATA.stuck||[];
  if(stuckRows.length){
    lc.hidden=false; lk.hidden=false; lk.textContent=T[lang].referenceTitle;
    const lByDate={}; stuckRows.forEach(r=>{(lByDate[r.date]||(lByDate[r.date]=[])).push(r);});
    const lLatest=Object.keys(lByDate).sort().pop();
    const openNow=lByDate[lLatest];
    const cnt=openNow.length;
    const lnEl=document.getElementById("level-n"); lnEl.textContent=cnt; lnEl.style.color=countColor(cnt);
    const names=openNow.map(r=>straitLabel(r.component,lang));
    setMarkup(document.getElementById("level-label"),
      T[lang].levelHead(cnt)
      +(cnt?`<span class="pairnote">${T[lang].levelWhich(names)}</span>`:"")
      +`<span class="calibnote"> · ${T[lang].referenceAsOf(lLatest)}</span>`);
    document.getElementById("level-q").textContent=T[lang].countQuestion;
    lc.onclick=()=>openModal(levelModal(lang));
  } else { lc.hidden=true; lk.hidden=true; }

  // chart range: slice the shared date axis to the selected window
  const range=getRange();
  document.querySelectorAll("#rangetoggle button").forEach(b=>{
    b.textContent=T[lang]["range_"+b.dataset.range];
    b.classList.toggle("on", b.dataset.range===range);
  });
  const cutDate=(range!=="all"&&last)
    ? new Date(utcMidnight(last.date)-(parseInt(range,10)-1)*86400000).toISOString().slice(0,10)
    : null;
  let viewDates=cutDate?dates.filter(d=>d>=cutDate):dates;
  // start the instrument chart where scoring began — the warm-up stretch has
  // no verdicts to draw and would render as a half-empty axis
  let firstScored=null;
  for(const L of TIER1){ const rows=lines[L.id]||[];
    for(const r of rows){ if(r.z_score!==""){ if(!firstScored||r.date<firstScored) firstScored=r.date; break; } } }
  if(firstScored) viewDates=viewDates.filter(d=>d>=firstScored);
  // with long histories, drop the everyday dots and keep only tremble markers
  const denseView=viewDates.length>120;

  const strip=document.getElementById("strip"); setMarkup(strip,"");
  const datasets=[]; const darkNames=[];
  for(const L of TIER1){
    const rows=lines[L.id]||[]; const byDate={}; rows.forEach(r=>byDate[r.date]=r);
    // per-date tremble state: "alarm" reads red, "benign" (guard reasserting) reads calm
    const trembleState=r=>r&&r.trembling==="1"?(r.direction===L.alarm?"alarm":"benign"):null;
    const tstate=viewDates.map(d=>trembleState(byDate[d]));
    const ptColor=tstate.map(t=>t==="alarm"?"#d64545":t==="benign"?"#3fb27f":L.color);
    // plot the RECORDED z_score — the instrument's actual verdicts — so the ±3
    // band and the marked trembles line up exactly; blank z (warm-up, stale
    // observation) is an honest gap the line spans
    const z=viewDates.map(d=>{ const r=byDate[d]; const v=r?parseFloat(r.z_score):NaN; return isNaN(v)?null:v; });
    const todayRow=last?byDate[last.date]:null;
    const hasToday=todayRow&&todayRow.raw_value!=="";
    const lastGood=[...rows].reverse().find(r=>r.raw_value!=="");
    const isClosed=!hasToday&&todayRow&&todayRow.status==="closed";
    const isDark=!hasToday&&!isClosed; if(isDark) darkNames.push(L.domain[lang]);
    const calibrating=uniqueObs(rows)<CALIBRATING_OBS;

    const chip=document.createElement("div");
    chip.className="inst"+(isDark?" dark":""); chip.style.setProperty("--dot",L.color);
    let nowHtml, subHtml;
    if(hasToday){
      let pill="";
      const t=trembleState(todayRow);
      if(t){
        // Chip-level disclosure, same precedence as the headline (shares the
        // same adjudication() lookup so the two can never disagree): an
        // adjudicated artifact, or (only absent that) a same-day common-mode
        // machine lean, hatches the "trembling" pill -- muted, still legibly
        // trembling, never hidden.
        const todayAnno=adjudication(L.id,todayRow.date);
        const todayLean=!todayAnno&&leanOn(L.id,todayRow.date);
        const adjudicated=(todayAnno&&todayAnno.verdict==="artifact")||(todayLean&&todayLean.lean==="common-mode");
        pill = t==="alarm"
          ? `<span class="pill trembling${adjudicated?" adjudicated":""}">${lang==="zh"?"颤抖":"trembling"}</span>`
          : `<span class="pill benign">${T[lang].benignShift}</span>`;
      } else if(calibrating) pill=`<span class="pill calib">${T[lang].calibrating}</span>`;
      nowHtml=`${fmt(todayRow.raw_value)} <span class="u">${L.unit[lang]}</span>`+pill;
      subHtml=`${L.label[lang]} · ${T[lang].alarmingWhen(L.alarm==="down"?T[lang].dirDown:T[lang].dirUp)}`;
    } else {
      nowHtml=isClosed
        ? `<span style="color:var(--muted)">${T[lang].statusLabel.closed}</span>`
        : `<span class="nodata">${T[lang].nodata}</span>`;
      const reason=todayRow?esc(todayRow.source_note):T[lang].noCollect;
      subHtml=`${reason}${lastGood?T[lang].last(fmt(lastGood.raw_value),L.unit[lang],lastGood.date):""}`;
    }
    setMarkup(chip,`<div class="domain">${L.domain[lang]}</div>
      <div class="now">${nowHtml}</div>
      <div class="sub">${subHtml}</div>
      <div class="more">${T[lang].more}</div>`);
    chip.onclick=()=>openModal(lineModal(L,lang));
    strip.appendChild(chip);

    datasets.push({ label:L.label[lang], _lineId:L.id, data:z, borderColor:L.color, backgroundColor:L.color,
      borderWidth:1.8, tension:.25, spanGaps:true,
      pointRadius:tstate.map(t=>t?4:(denseView?0:2)), pointHoverRadius:5,
      pointBackgroundColor:ptColor, pointBorderColor:ptColor });
  }

  // Field of view. The trembling count is a statement about the primary
  // instruments (however many there are — read live off TIER1), not about the
  // world; say where they point so a reader can judge the silence for themselves.
  const cov=document.getElementById("coverage"); cov.hidden=false;
  // Derived from the same `watches` metadata the modal uses, so a tier swap can
  // never leave this sentence describing instruments that are no longer here.
  setMarkup(cov,`${T[lang].coverage(TIER1.map(L=>L.watches[lang]).join(" · "))}`
    +`<span class="cmore" id="covmore">${T[lang].covMore}</span>`);
  document.getElementById("covmore").onclick=()=>{
    document.getElementById("limits").scrollIntoView({behavior:"smooth",block:"start"});
  };

  // system status banner
  const st=document.getElementById("sysstatus"); st.hidden=false;
  if(!last){ st.className="sysstatus alarm"; setMarkup(st,`<span class="h">${T[lang].nodata}</span>`); }
  else if(gapDays>=2){ st.className="sysstatus alarm"; setMarkup(st,`<span class="h">${T[lang].disruptH}</span>${T[lang].disruptB(last.date,gapDays)}`); }
  else if(darkCount*2>TIER1.length){ st.className="sysstatus alarm"; setMarkup(st,`<span class="h">${T[lang].alarmDarkH(darkCount,TIER1.length)}</span>${T[lang].alarmDarkB(darkNames.join(", "))}`); }
  else if(darkCount>=1){ st.className="sysstatus warn"; setMarkup(st,`<span class="h">${T[lang].warnH(darkCount)}</span>${T[lang].warnB(darkNames.join(", "))}`); }
  else { st.className="sysstatus ok"; setMarkup(st,`<span class="h">${T[lang].statusOk}</span>`+(gapDays>=1?T[lang].awaiting(last.date):"")); }

  // Dashed ±3 trembling-threshold guides — visual reference only, kept out of
  // the legend and the hover tooltip so only the real lines are listed.
  const thr=v=>({label:(v>0?"+":"")+v, _threshold:true, data:viewDates.map(()=>v),
    borderColor:"rgba(214,69,69,.45)", borderWidth:1, borderDash:[5,4],
    pointRadius:0, pointHoverRadius:0, fill:false, tension:0});
  if(chart) chart.destroy();
  chart=new Chart(document.getElementById("chart"),{
    type:"line", data:{ labels:viewDates, datasets:[...datasets, thr(3), thr(-3)] },
    options:{ responsive:true, animation:false, interaction:{mode:"index",intersect:false},
      plugins:{ legend:{labels:{color:"#c7ccd6",boxWidth:14,font:{size:11},
                  filter:(item,data)=>!data.datasets[item.datasetIndex]._threshold}},
        tooltip:{ filter:item=>!item.dataset._threshold,
          callbacks:{label:c=>c.parsed.y==null?null:`${c.dataset.label}: z=${c.parsed.y.toFixed(2)}`,
            afterLabel:c=>{ const a=c.dataset._lineId&&annoOn(c.dataset._lineId,c.label);
              return a?wrapNote("• "+a.note):null; }}} },
      scales:{ x:{ticks:{color:"#8a909c",maxTicksLimit:8,font:{size:10}},grid:{color:"#1c1f27"}},
        y:{title:{display:true,text:lang==="zh"?"稳健 z 分数":"robust z-score",color:"#8a909c",font:{size:11}},
           ticks:{color:"#8a909c",font:{size:10}},grid:{color:"#1c1f27"}} } }
  });

  // ---- real vs felt: the answer to the question's second half ----
  document.getElementById("feel-title").textContent=T[lang].feelTitle;
  document.getElementById("feel-hint").textContent=T[lang].feelHint;
  const sumBy={}; summary.forEach(r=>sumBy[r.date]=r);
  // the feel axis is independent of the instrument axis: seeded feel history
  // (the VIX archive) predates the instrument's birth and deserves to show —
  // bars are simply absent for days before the instrument existed
  let feelDates=[...new Set([...dates,...FEEL_IDS.flatMap(id=>(lines[id]||[]).map(r=>r.date))])].sort();
  if(cutDate) feelDates=feelDates.filter(d=>d>=cutDate);
  const counts=feelDates.map(d=>{const r=sumBy[d];
    return r&&r.trembling_count!==""?(parseInt(r.trembling_count,10)||0):null;});
  let feelMax=feelDates.map(()=>null);
  const feelSets=FEEL_IDS.map(id=>{
    const L=LINES.find(l=>l.id===id); if(!L) return null;
    const byD={}; (lines[id]||[]).forEach(r=>byD[r.date]=r);
    // z toward the line's alarming direction, so "up" always reads "feels worse"
    const zA=feelDates.map((d,i)=>{const r=byD[d]; const v=r?parseFloat(r.z_score):NaN;
      if(isNaN(v)) return null;
      const t=L.alarm==="down"?-v:v;
      if(feelMax[i]===null||t>feelMax[i]) feelMax[i]=t;
      return t;});
    return { type:"line", label:L.label[lang], data:zA, yAxisID:"y2",
      borderColor:L.color, backgroundColor:L.color, borderWidth:1.6, tension:.25,
      spanGaps:true, pointRadius:0, pointHoverRadius:4, order:1 };
  }).filter(ds=>ds&&ds.data.some(v=>v!==null));  // hide lines still warming up
  // anxiety premium: feeling hot (any feel z>=2) while the instruments read 0
  const gapCol=feelDates.map((d,i)=>isDivergent(counts[i],feelMax[i])?4:null);
  if(feelChart) feelChart.destroy();
  feelChart=new Chart(document.getElementById("feelchart"),{
    data:{ labels:feelDates, datasets:[
      { type:"bar", label:T[lang].feelBars, data:counts, yAxisID:"y",
        backgroundColor:"rgba(214,69,69,.55)", order:3 },
      { type:"bar", label:"gap", _gap:true, data:gapCol, yAxisID:"y",
        backgroundColor:"rgba(224,168,61,.28)", barPercentage:1, categoryPercentage:1, order:4 },
      ...feelSets ]},
    options:{ responsive:true, animation:false, interaction:{mode:"index",intersect:false},
      plugins:{ legend:{labels:{color:"#c7ccd6",boxWidth:14,font:{size:11},
                  filter:(item,data)=>!data.datasets[item.datasetIndex]._gap}},
        tooltip:{ filter:item=>!item.dataset._gap,
          callbacks:{label:c=>c.parsed.y==null?null:
            (c.dataset.type==="bar"?`${c.dataset.label}: ${c.parsed.y}`:`${c.dataset.label}: z=${c.parsed.y.toFixed(2)}`)}} },
      scales:{ x:{ticks:{color:"#8a909c",maxTicksLimit:8,font:{size:10}},grid:{color:"#1c1f27"}},
        y:{min:0,max:4,ticks:{stepSize:1,color:"#8a909c",font:{size:10}},grid:{color:"#1c1f27"},
           title:{display:true,text:lang==="zh"?"颤抖根数":"trembles",color:"#8a909c",font:{size:10}}},
        y2:{position:"right",grid:{drawOnChartArea:false},ticks:{color:"#8a909c",font:{size:10}},
           title:{display:true,text:lang==="zh"?"感觉 z（报警方向）":"feel z (toward alarm)",color:"#8a909c",font:{size:10}}} } }
  });

  // watchlist — tier-2 candidates: collected daily, not counted; click for data
  const wl=document.getElementById("watchlist");
  setMarkup(wl,""); wl.hidden=!TIER2.length;
  if(TIER2.length){
    const b=document.createElement("b"); b.textContent=T[lang].watchTitle; b.style.display="block"; b.style.marginBottom="4px"; wl.appendChild(b);
    for(const L of TIER2){
      const rows=lines[L.id]||[];
      const days=rows.filter(r=>r.raw_value!=="").length;
      // Say when a line cannot score. A watchlist entry that is silently unable
      // to judge its own reading is indistinguishable from one that is calm.
      const r=rows.slice(-1)[0]||{};
      const stTxt=(T[lang].statusLabel||{})[r.status];
      const blind=isBlind(r);
      // A tier-2 line stuck GAP_RUN_LOUD+ collections deep in a GAP_STATUSES
      // status (today: dark) has no reading at all, and used to render exactly
      // like a calm one — nothing in the item marked it. This is the one place
      // that unreachable "dark":"NO DATA" statusLabel entry gets read.
      const gap=gapRunLength(rows)>=GAP_RUN_LOUD;
      const item=document.createElement("span"); item.className="wl-item"+(gap?" wl-gap":"");
      setMarkup(item,`<span class="dot"></span>${L.label[lang]} <span class="days">(${T[lang].watchDays(days)})`
        + (gap?` <span class="wl-gap">${stTxt||T[lang].nodata}</span>`
           : (blind&&stTxt?` <span class="wl-blind">${stTxt}</span>`:""))+` ›</span>`);
      item.onclick=()=>openTier2Modal(L,lang);
      wl.appendChild(item);
    }
  }

  // Scope and limits: always-visible body text, never a panel. The region list is
  // derived from the same `watches` metadata the coverage line uses; the four
  // limitations and the measured flights sampling fact are the deck's copy.
  const lim=document.getElementById("limits"); lim.hidden=false;
  setMarkup(lim,`<h2>${T[lang].limitsTitle}</h2>`
    +`<ul class="cov">${TIER1.map(L=>`<li><b>${L.domain[lang]}</b> — ${L.watches[lang]}</li>`).join("")}</ul>`
    +`<p>${T[lang].limitsBody}</p><p>${T[lang].limitsFlights}</p>`);
}

// tier-2 detail: explanation + latest reading + mini history chart + attributions.
// Deliberately muted — watchlist lines are observed, never counted in the resonance.
function openTier2Modal(L,lang){
  const rows=(DATA.lines[L.id]||[]).filter(r=>r.raw_value!=="");
  const cur=rows[rows.length-1];
  const dir=L.alarm==="down"?T[lang].dirDown:T[lang].dirUp;
  const annos=annosFor(L.id).slice(-3).reverse();
  const annoHtml=annos.length
    ? `<h4 class="annoh">${T[lang].annoTitle}</h4>`+annos.map(a=>
        `<p class="anno"><b>${esc(a.date)}</b> <span class="tag2">${esc(a.verdict)}</span> ${esc(a.note)}</p>`).join("")
    : "";
  openModal(`<div class="mdomain">${L.domain[lang]}</div>
    <h3>${L.label[lang]}</h3>
    <div class="tags"><span class="tag2">${T[lang].notCounted}</span><span class="tag2">${T[lang].alarmTag(dir)}</span><span class="tag2">${T[lang].source}: ${L.source[lang]}</span></div>
    <h4 class="annoh">${T[lang].measuresLabel}</h4><p>${L.measures[lang]}</p>
    ${cur?`<p class="mnow"><b>${fmt(cur.raw_value)}</b> ${L.unit[lang]} <span class="days">(${cur.date}${cur.z_score?` · z=${cur.z_score}`:""})</span></p>`:""}
    <canvas class="mchart" height="110"></canvas>
    ${annoHtml}`);
  // mini chart of raw values, tremble points colored like the main chart
  const recent=rows.slice(-90);
  const colors=recent.map(r=>r.trembling==="1"?(r.direction===L.alarm?"#d64545":"#3fb27f"):L.color);
  if(modalChart) modalChart.destroy();
  modalChart=new Chart(document.querySelector("#modal-body .mchart"),{
    type:"line",
    data:{ labels:recent.map(r=>r.date), datasets:[{ data:recent.map(r=>parseFloat(r.raw_value)),
      borderColor:L.color, borderWidth:1.5, tension:.25, spanGaps:true,
      pointRadius:recent.map(r=>r.trembling==="1"?4:(recent.length>60?0:2)),
      pointBackgroundColor:colors, pointBorderColor:colors }] },
    options:{ responsive:true, animation:false,
      plugins:{ legend:{display:false},
        tooltip:{callbacks:{label:c=>`${fmt(c.parsed.y)} ${L.unit[lang]}`}} },
      scales:{ x:{ticks:{color:"#8a909c",maxTicksLimit:6,font:{size:9}},grid:{color:"#1c1f27"}},
        y:{ticks:{color:"#8a909c",font:{size:9}},grid:{color:"#1c1f27"}} } }
  });
}

document.querySelectorAll("#langtoggle button").forEach(b=>b.onclick=()=>{ setLang(b.dataset.lang); render(); });
document.querySelectorAll("#rangetoggle button").forEach(b=>b.onclick=()=>{ setRange(b.dataset.range); render(); });
(async()=>{ await load(); render(); })();
</script>
